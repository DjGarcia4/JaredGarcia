<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frontend Developer & UI/UX Designer en Honduras. Diseño la experiencia y la construyo hasta producción: Vue, TypeScript, SaaS y sistemas de diseño."
    />
    <!-- Open Graph / Twitter: LinkedIn y WhatsApp no ejecutan JS, así que
         estas metas estáticas son las que se ven al compartir el link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jared Garcia" />
    <meta property="og:locale" content="es_HN" />
    <meta property="og:title" content="Jared Garcia — Frontend Developer & UI/UX Designer" />
    <meta
      property="og:description"
      content="Diseño la experiencia y la construyo hasta producción. Head of Development en Wink Digital y creador de RapiSites."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jared Garcia — Frontend Developer & UI/UX Designer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jared Garcia — Frontend Developer & UI/UX Designer" />
    <meta
      name="twitter:description"
      content="Diseño la experiencia y la construyo hasta producción. Head of Development en Wink Digital y creador de RapiSites."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Jared Garcia — Frontend Developer & UI/UX Designer</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Netlify Forms detecta formularios en el HTML del build; como el real
         lo renderiza Vue, este espejo oculto declara sus campos. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="fullname" />
      <input name="email" />
      <textarea name="message"></textarea>
      <input name="lang" />
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
